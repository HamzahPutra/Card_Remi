<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remi Arena - Game Engine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>🃏 Remi Arena Engine</h2>

    <!-- TAHAP 1: SETUP -->
    <div id="setupScreen" class="setup-section">
        <label>Pilih Jumlah Pemain:</label>
        <select id="playerCountSelect" onchange="generatePlayerInputs()">
            <option value="3">3 Pemain</option>
            <option value="4" selected>4 Pemain</option>
        </select>
        <div id="dynamicInputs"></div>
        <button class="btn-primary" onclick="mulaiPermainan()">Mulai Game 🚀</button>
    </div>

    <!-- TAHAP 2: ARENA GAME -->
    <div id="gameScreen" class="hidden">
        <div class="game-board">
            <div class="board-section">
                <h3 id="turnInfo">Giliran: Pemain 1</h3>
                <p id="gameStatus" style="font-size: 13px; color: #ff9800; margin: 0;">Status: Wajib ambil kartu terlebih dahulu!</p>
            </div>

            <!-- Papan Meja -->
            <div class="board-section">
                <h3>Papan Meja (Batas: <span id="maxBoardLimit">7</span> kartu)</h3>
                <div id="boardCardsArea" class="card-container">
                    <span style="color: #666; font-size: 13px;">Belum ada kartu di papan</span>
                </div>
            </div>

            <!-- Tangan Pemain -->
            <div class="player-hand">
                <h3 id="activePlayerName">Kartu di Tangan</h3>
                <div id="playerHandArea" class="card-container"></div>
            </div>

            <!-- Tombol Aksi -->
            <div class="action-buttons">
                <button class="btn-primary" onclick="aksiAmbilDariDeck()">Ambil dari Sisa Deck</button>
                <button class="btn-warning" onclick="aksiBuangKePapan()">Buang ke Papan</button>
            </div>
        </div>

        <button class="btn-danger" onclick="resetKeMenu()">Keluar / Reset Game</button>
    </div>
</div>

<script src="script.js?v=3"></script>
</body>
</html>
