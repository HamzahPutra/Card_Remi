<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remi Arena - Modular Version</title>
    <!-- Menghubungkan file CSS eksternal -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>🃏 Remi Arena</h2>

    <!-- TAHAP 1: MENU SETUP AWAL -->
    <div id="setupScreen" class="setup-section">
        <label>Pilih Jumlah Pemain:</label>
        <select id="playerCountSelect" onchange="generatePlayerInputs()">
            <option value="3">3 Pemain</option>
            <option value="4" selected>4 Pemain</option>
        </select>

        <div id="dynamicInputs">
            <!-- Input nama akan dimunculkan otomatis via JavaScript -->
        </div>

        <button class="btn-primary" onclick="mulaiPermainan()">Mulai Game 🚀</button>
    </div>

    <!-- TAHAP 2: ARENA PERMAINAN UTAMA -->
    <div id="gameScreen" class="hidden">
        <div class="game-board">
            <!-- Informasi Giliran & Status -->
            <div class="board-section">
                <h3 id="turnInfo">Giliran: Pemain 1</h3>
                <p id="gameStatus" style="font-size: 13px; color: #4caf50; margin: 0;">Status: Menunggu giliran ambil kartu</p>
            </div>

            <!-- Papan Permainan (Tengah Meja) -->
            <div class="board-section">
                <h3>Papan Meja (Batas maksimal kartu: <span id="maxBoardLimit">7</span>)</h3>
                <div id="boardCardsArea" class="card-container">
                    <span style="color: #666; font-size: 13px;">Belum ada kartu di papan</span>
                </div>
            </div>

            <!-- Tangan Pemain Aktif -->
            <div class="player-hand">
                <h3 id="activePlayerName">Kartu di Tanganmu</h3>
                <div id="playerHandArea" class="card-container">
                    <!-- Kartu pemain akan muncul di sini -->
                </div>
            </div>

            <!-- Tombol Interaksi Aksi Pemain -->
            <div class="action-buttons">
                <button class="btn-primary" onclick="aksiAmbilKartu()">Ambil Kartu Tengah</button>
                <button class="btn-warning" onclick="aksiBuangKartu()">Buang Kartu</button>
            </div>
        </div>

        <button class="btn-danger" onclick="resetKeMenu()">Keluar / Reset Game</button>
    </div>
</div>

<!-- Menghubungkan file JavaScript eksternal -->
<script src="script.js"></script>

</body>
</html>
